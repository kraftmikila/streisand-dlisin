name: Build Streisand Routing Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build GeoSite and routing source lists
        run: python3 build.py
      - name: Validate generated files
        run: |
          python3 - <<'PY'
          import base64, json, pathlib, plistlib
          p = pathlib.Path("dist")
          route = json.loads((p / "streisand-route.json").read_text())
          combined_route = json.loads((p / "streisand-route-combined.json").read_text())
          assert (p / "custom.dat").stat().st_size > 1000
          assert (p / "custom-geoip.dat").stat().st_size > 1000
          assert (p / "custom-combined.dat").stat().st_size > 1000
          assert any("ext:custom.dat:proxy" in r.get("domain", []) for r in route["rules"])
          assert any("ext:custom.dat:direct" in r.get("domain", []) for r in route["rules"])
          assert any("ext:custom-geoip.dat:proxy" in r.get("ip", []) for r in route["rules"])
          assert any("ext:custom-geoip.dat:direct" in r.get("ip", []) for r in route["rules"])
          assert any(r.get("outboundTag") == "direct" and not r.get("domain") and not r.get("ip") for r in route["rules"])
          def validate_import(stem, expected):
              uri = (p / f"{stem}.txt").read_text().strip()
              assert uri.startswith("streisand://")
              outer = base64.b64decode(uri[len("streisand://"):]).decode()
              assert outer.startswith("import/route://")
              imported = plistlib.loads(base64.b64decode(outer.split("://", 1)[1]))
              assert imported == expected
          validate_import("streisand-route", route)
          validate_import("streisand-route-combined", combined_route)
          assert any("ext:custom-combined.dat:DIRECT-DOMAIN" in r.get("domain", []) for r in combined_route["rules"])
          assert any("ext:custom-combined.dat:PROXY-DOMAIN" in r.get("domain", []) for r in combined_route["rules"])
          assert any("ext:custom-combined.dat:DIRECT-IP" in r.get("ip", []) for r in combined_route["rules"])
          assert any("ext:custom-combined.dat:PROXY-IP" in r.get("ip", []) for r in combined_route["rules"])
          standalone = json.loads((p / "streisand-route-standalone.json").read_text())
          assert any(r.get("domain") and any(not d.startswith("ext:") for d in r["domain"]) for r in standalone["rules"])
          assert not any("ext:custom.dat:" in d for r in standalone["rules"] for d in r.get("domain", []))
          assert any(r.get("outboundTag") == "proxy" and r.get("domain") for r in standalone["rules"])
          assert any(r.get("outboundTag") == "direct" and not r.get("domain") and not r.get("ip") for r in standalone["rules"])
          validate_import("streisand-route-standalone", standalone)
          def varint(data, pos):
              n = shift = 0
              while True:
                  b = data[pos]
                  pos += 1
                  n |= (b & 127) << shift
                  if b < 128:
                      return n, pos
                  shift += 7
          def fields(data):
              pos = 0
              while pos < len(data):
                  key, pos = varint(data, pos)
                  number, wire = key >> 3, key & 7
                  if wire == 0:
                      value, pos = varint(data, pos)
                  elif wire == 2:
                      size, pos = varint(data, pos)
                      value = data[pos:pos + size]
                      pos += size
                  else:
                      raise ValueError("Unsupported protobuf wire type")
                  yield number, wire, value
          tags = {}
          for number, wire, value in fields((p / "custom.dat").read_bytes()):
              assert number == 1 and wire == 2
              nested = list(fields(value))
              tag = next(v.decode() for n, _, v in nested if n == 1)
              count = sum(1 for n, _, _ in nested if n == 2)
              tags[tag] = count
          assert tags.get("PROXY", 0) > 0 and tags.get("DIRECT", 0) > 0
          geoip_tags = {}
          for number, wire, value in fields((p / "custom-geoip.dat").read_bytes()):
              assert number == 1 and wire == 2
              nested = list(fields(value))
              tag = next(v.decode() for n, _, v in nested if n == 1)
              count = sum(1 for n, _, _ in nested if n == 2)
              geoip_tags[tag] = count
          assert geoip_tags.get("PROXY", 0) > 0 and geoip_tags.get("DIRECT", 0) > 0
          print("Validated GeoSite protobuf:", tags)
          print("Validated GeoIP protobuf:", geoip_tags)
          combined_tags = {}
          for number, wire, value in fields((p / "custom-combined.dat").read_bytes()):
              assert number == 1 and wire == 2
              nested = list(fields(value))
              tag = next(v.decode() for n, _, v in nested if n == 1)
              count = sum(1 for n, _, _ in nested if n == 2)
              combined_tags[tag] = count
          for tag in ("DIRECT-DOMAIN", "PROXY-DOMAIN", "DIRECT-IP", "PROXY-IP"):
              assert combined_tags.get(tag, 0) > 0, f"Missing or empty combined tag: {tag}"
          assert len(combined_tags) == 4, f"Unexpected combined tags: {combined_tags}"
          print("Validated hybrid GeoSite+GeoIP protobuf:", combined_tags)
          print("Validated Streisand import routes and bplist payloads")
          PY
      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: streisand-dlisin-build
          path: dist/
          if-no-files-found: error
      - name: Publish latest GeoSite release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest generated GeoSite
          make_latest: true
          overwrite_files: true
          files: |
            dist/custom.dat
            dist/custom-geoip.dat
            dist/custom-combined.dat
            dist/proxy-ips.txt
            dist/direct-ips.txt
            dist/proxy-ports.txt
            dist/report.json
            dist/streisand-route.json
            dist/streisand-route.txt
            dist/streisand-route-combined.json
            dist/streisand-route-combined.txt
            dist/streisand-route-standalone.json
            dist/streisand-route-standalone.txt
