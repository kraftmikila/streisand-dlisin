name: Build Streisand GeoSite

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build GeoSite and routing source lists
        run: python3 build.py
      - name: Validate generated GeoSite and routing files\n        run: |\n          python3 - <<'PY'\n          import json, pathlib\n          p=pathlib.Path('dist')\n          route=json.loads((p/'streisand-route.json').read_text())\n          assert (p/'custom.dat').stat().st_size > 1000\n          assert route['domainStrategy']=='IPIfNonMatch'\n          assert route['domainMatcher']=='hybrid'\n          assert any('ext:custom.dat:proxy' in r.get('domain',[]) for r in route['rules'])\n          assert any(r.get('outboundTag')=='direct' and not r.get('domain') and not r.get('ip') for r in route['rules'])\n          assert (p/'streisand-route.txt').read_text().startswith('streisand://')\n          print('GeoSite and Streisand route profile validation passed')\n          PY\n      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: streisand-dlisin-build
          path: dist/
          if-no-files-found: error
      - name: Publish latest GeoSite release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest generated GeoSite
          make_latest: true
          overwrite_files: true
          files: |
            dist/custom.dat
            dist/proxy-ips.txt
            dist/direct-ips.txt
            dist/proxy-ports.txt
            dist/report.json
            dist/streisand-route.json\n            dist/streisand-route.txt
